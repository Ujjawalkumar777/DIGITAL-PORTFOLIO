<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            background-color: lightblue;
            color: rgb(255, 0, 144);
            border: 2px solid black;
            padding: 20px;
            margin: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>this is a div element</h1>
        <p>div is a block level element</p>
        <div style="background-color: lightgreen; color: black; border: 2px solid red; padding: 20px; margin: 20px;">
            <h2>this is a nested div element</h2>
            <p>this is a nested div element inside the main div element</p>
        </div>
    </div>
</body>
</html>
