<!DOCTYPE html>
<html>
<head>
<title>Flexbox Properties</title>

<style>
body{
margin:0;
font-family:Arial;
background-color:lightgray;
}

.container{
display:flex;                 /* 1 */
justify-content:space-between; /* 2 */
align-items:center;            /* 3 */
gap:20px;                      /* 4 */
flex-wrap:wrap;                /* 6 */

width:60%;
height:300px;
margin:auto;
margin-top:40px;
padding:10px;
border:2px solid rgb(0, 0, 0);
background-color:rgb(233, 137, 137);
}

.box{
width:100px;
height:100px;
color:white;
font-size:25px;
display:flex;
justify-content:center;
align-items:center;
}

.box1{
background-color:rgb(208, 255, 0);
}

.box2{
background-color:rgb(255, 0, 238);
flex-grow:1;                   /* 5 */
}

.box3{
background-color:rgb(0, 0, 128);
}

.box4{
background-color:rgb(0, 255, 110);
}
</style>

</head>
<body>

<h1 align="center">Flexbox Properties Example</h1>

<div class="container">

<div class="box box1">Box 1</div>

<div class="box box2">Box 2</div>

<div class="box box3">Box 3</div>

<div class="box box4">Box 4</div>

</div>

</body>
</html>
