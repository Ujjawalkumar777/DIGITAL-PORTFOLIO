<!DOCTYPE html>
<html>
<head>
    <title>Header Footer Page</title>

    <style>
        header {
            background-color: lightblue;
            padding: 15px;
        }

        nav a {
            text-decoration: none;
            margin-right: 15px;
            color: rgb(0, 0, 0);
        }

        .circle {
            width: 100px;
            height: 100px;
            background-color: rgb(13, 0, 128);
            border-radius: 50%;
            margin-top: 10px;
        }

        .content {
            padding: 20px;
            min-height: 300px;
        }

        .box { display:flex
            width : 100px;
            height : 100px;
            background-color : yellow
        ;
            display : inline-block;
            margin : 10px;
            text-align : center;
            line-height : 100px;
        }

        footer {
            background-color: lightgray;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </nav>

        <div class="circle"></div>
    </header>

    <div class="content">
        <h2>Content Area</h2>

        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
    </div>

    <footer>
        <p>Footer Content</p>
    </footer>

</body>
</html>
